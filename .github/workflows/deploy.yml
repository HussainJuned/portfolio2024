name: Deploy to Namecheap Server

on:
  push:
    branches:
      - master  # Adjust to your main branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Replace with the latest version that supports Node.js 20
        
      - name: Prepare SSH directory
        run: mkdir -p ~/.ssh
      
      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa 198.54.114.247 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Debug SSH keyscan
        run: ssh-keyscan -t rsa 198.54.114.247
      
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: |
            198.54.114.247 ssh-rsa ssh-rsa   # Replace with your server's IP and SSH key
          
      - name: Deploy to Namecheap Server
        run: |
          scp -r -P 21098 * junecqhi@198.54.114.247:/home/junecqhi/public_html/ && git pull
